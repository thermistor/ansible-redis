---


# Needed for deb822_repository
- name: Install python3-debian
  ansible.builtin.apt:
    pkg: python3-debian
    state: present

- name: Download redis repository key
  ansible.builtin.get_url:
    url: https://packages.redis.io/gpg
    dest: "{{ redis_keyring_file }}"
    mode: '0644'

# Superseded by the deb822 redis.sources file, remove it so apt doesn't see the repo twice
- name: Remove the legacy redis apt_repository source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/packages_redis_io_deb.list
    state: absent

- name: Add redis repository
  ansible.builtin.deb822_repository:
    name: redis
    types: deb
    uris: "{{ redis_repository_url }}"
    suites: "{{ redis_repository_suite }}"
    components: main
    signed_by: "{{ redis_keyring_file }}"
    state: present
  register: redis_repository

- name: Update apt cache if the redis repository changed
  ansible.builtin.apt:
    update_cache: true
  when: redis_repository is changed # noqa: no-handler

- name: Install redis packages
  ansible.builtin.apt:
    pkg:
      - redis
    state: present

- name: Install the the systemd config
  ansible.builtin.template:
    src: redis-server.service.j2
    dest: /lib/systemd/system/{{ redis_instance_name }}-server.service
    mode: '0644'

- name: Ensure redis data directory exists
  ansible.builtin.file:
    path: "{{ redis_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: '0750'

- name: Ensure redis log directory exists
  ansible.builtin.file:
    path: /var/log/{{ redis_instance_name }}
    state: directory
    owner: redis
    group: adm
    mode: '0750'

- name: Ensure redis config directory exists
  ansible.builtin.file:
    path: /etc/{{ redis_instance_name }}
    state: directory
    owner: redis
    group: redis
    mode: '0750'

# Redis warns at startup without this, a background save (fork) can fail under memory pressure
- name: Enable memory overcommit for redis
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "{{ redis_vm_overcommit_memory }}"
    sysctl_file: /etc/sysctl.d/60-redis.conf
    sysctl_set: true
    reload: true
    state: present

- name: Install the redis config
  ansible.builtin.template:
    src: "redis.conf.j2"
    dest: /etc/{{ redis_instance_name }}/redis.conf
    mode: '0640'
    owner: redis
    group: redis
  notify: Restart {{ redis_instance_name }}

- name: Force systemd to reread configs (2.4 and above)
  ansible.builtin.systemd:
    daemon_reload: true

# Creates the multi-user.target.wants link (start at boot) and the Alias= symlink. The systemd
# module can't be relied on for this: hosts set up before Alias= was declared for every instance
# have an undeclared alias symlink, so is-enabled reports "indirect" and older ansible versions
# treated that as already enabled.
- name: Enable at boot {{ redis_instance_name }}
  ansible.builtin.command: systemctl enable {{ redis_instance_name }}-server # noqa: command-instead-of-module
  args:
    creates: /etc/systemd/system/multi-user.target.wants/{{ redis_instance_name }}-server.service

# Started here too, the restart handler doesn't run if the play fails before handlers are flushed
- name: Ensure service is enabled and started
  ansible.builtin.systemd:
    name: "{{ redis_instance_name }}-server"
    enabled: true
    state: started
